name: Monthly source & link verification

on:
  schedule:
    # Run on the 1st of every month at 08:00 UTC
    - cron: '0 8 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run build and live source link checks
        id: check
        continue-on-error: true
        run: |
          npm run verify 2>&1 | tee verify-output.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Check that generated files match committed versions
        id: drift
        continue-on-error: true
        run: |
          git diff --exit-code README.md README.es.md data/tools.csv docs/index.html

      - name: Open maintenance issue on failure
        if: steps.check.outputs.exit_code != '0' || steps.drift.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const log = fs.existsSync('verify-output.log') ? fs.readFileSync('verify-output.log', 'utf8').slice(0, 6000) : 'No log captured.';
            const title = 'Monthly verification alert: check official benchmark sources';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 30,
            });
            const body = [
              `Automated monthly check ran on **${new Date().toISOString().slice(0, 10)}** and detected an issue.`,
              '',
              `- **Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- **Link & policy check exit code:** ${process.env.CHECK_EXIT}`,
              `- **Generated files drift:** ${process.env.DRIFT_OUTCOME}`,
              '',
              '### Output',
              '```text',
              log,
              '```',
            ].join('\n');
            const match = existing.data.find((i) => i.title === title);
            if (match) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
        env:
          CHECK_EXIT: ${{ steps.check.outputs.exit_code }}
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}

      - name: Fail job if verification failed
        if: steps.check.outputs.exit_code != '0' || steps.drift.outcome == 'failure'
        run: exit 1
